name: customer_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pinput: ^5.0.0
  http: ^1.2.0
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  image_picker: ^1.2.2
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  webview_flutter: ^4.7.0
  app_links: ^6.3.3
  easy_localization: ^3.0.7
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/translations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf